<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Petugas</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h2>Login Petugas</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        {% if error %}

            <p class="error-message">
                {{ error }}
            </p>

        {% endif %}

        <a
            href="/"
            class="back-link"
        >
            &larr; Kembali ke Chatbot
        </a>

    </div>

</div>

</body>
</html>
