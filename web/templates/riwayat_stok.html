<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Riwayat Stok</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
            padding:30px;
        }

        .container{
            max-width:1200px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        .header h1{
            font-size:28px;
        }

        .header-actions{
            display:flex;
            gap:10px;
        }

        .back-btn,
        .logout-btn{
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:8px;
            cursor:pointer;
            text-decoration:none;
        }

        .back-btn{
            background:#007bff;
        }

        .logout-btn{
            background:#dc3545;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        table th,
        table td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        table th{
            background:#333;
            color:white;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Riwayat Stok</h1>

        <div class="header-actions">

            <a
                href="/dashboard_barang"
                class="back-btn"
            >
                Kembali
            </a>

            <a
                href="/logout"
                class="logout-btn"
            >
                Logout
            </a>

        </div>

    </div>

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Petugas</th>

                <th>Barang</th>

                <th>Aksi</th>

                <th>Stok Lama</th>

                <th>Stok Baru</th>

                <th>Tanggal</th>

            </tr>

        </thead>

        <tbody>

            {% for riwayat in data_riwayat %}

            <tr>

                <td>{{ riwayat[0] }}</td>

                <td>{{ riwayat[1] }}</td>

                <td>{{ riwayat[2] }}</td>

                <td>{{ riwayat[3] }}</td>

                <td>{{ riwayat[4] }}</td>

                <td>{{ riwayat[5] }}</td>

                <td>{{ riwayat[6] }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
